name: profile-test-pgadmin-lab

services:
  db:
    build:
      context: .
    image: profile-test-pgadmin-postgres:1.0
    environment:
      POSTGRES_DB: pgadmin_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lab

  pgadmin:
    image: dpage/pgadmin4:9.19
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:8086:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - type: bind
        source: ./servers.json
        target: /pgadmin4/servers.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      - lab

networks:
  lab:

volumes:
  postgres_data:
  pgadmin_data:
